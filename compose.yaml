services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: msm
      POSTGRES_PASSWORD: Mk123456
      POSTGRES_DB: swapwithusDB
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:  # Wait until DB is ready
        test: ["CMD-SHELL", "pg_isready -U msm -d swapwithusDB"]
        interval: 5s
        timeout: 5s
        retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Local Google Cloud Storage emulator (NOT a Google product - community image).
  # Impersonates the GCS API so dev/test never touch a real bucket. Routed via
  # STORAGE_EMULATOR_HOST in scripts/dev/run-local.sh.
  gcs:
    image: fsouza/fake-gcs-server:1.52
    command: ["-scheme", "http", "-port", "4443", "-public-host", "localhost:4443", "-external-url", "http://localhost:4443"]
    ports:
      - "4443:4443"
    volumes:
      - gcs_data:/storage

volumes:
  db_data:
  redis_data:
  gcs_data:
